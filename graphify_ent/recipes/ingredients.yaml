# Canonical ingredient registry — pluggable, per the DOMAIN-AGNOSTIC rule.
#
# Nothing in the code knows a single ingredient name: this file is the whole
# vocabulary, and another domain replaces it wholesale
# (ENTERPRIPHY_INGREDIENTS points elsewhere).
#
# Two things every entry may carry, and both were measured before being trusted
# (evidence/T98, 1,433 dual-unit lines mined from the corpus as free ground
# truth — the books state "¾ cup (180 ml)" themselves, so the table can be
# checked against the authors):
#
#   density  g/ml, used to turn a volume into grams. Median error against the
#            books' own equivalences: 6.2% (acceptance was 15%). Sugar is the
#            worst entry at exactly 15%.
#   unit_g   grams per piece, for lines that count instead of weighing.
#
# **Density is per STATE, not per substance.** `cream` and `cream_whipped` are
# separate entries because whipping halves the density: taking one for the other
# was a 150% error in the measurement, which is why the state is in the name.
#
# `synonyms` are matched leftmost-first inside a line, so an ingredient line is
# classified by its head noun. Order within a list does not matter; position in
# the LINE does.

version: 4

units:
  # ml per unit of volume
  volume_ml:
    ml: 1.0
    cl: 10.0
    dl: 100.0
    l: 1000.0
    litre: 1000.0
    liter: 1000.0
    cup: 240.0
    cups: 240.0
    tbsp: 15.0
    tablespoon: 15.0
    tablespoons: 15.0
    tsp: 5.0
    teaspoon: 5.0
    teaspoons: 5.0
    "fl oz": 30.0
    pt: 473.0
    pint: 473.0
    qt: 946.0
    quart: 946.0
  # grams per unit of mass
  mass_g:
    mg: 0.001
    g: 1.0
    gr: 1.0
    kg: 1000.0
    oz: 28.35
    ounce: 28.35
    ounces: 28.35
    lb: 453.6
    pound: 453.6
    pounds: 453.6

# Phrases that state a quantity without giving one. They count for PRESENCE —
# which with rarity weighting is already half of identity — and never for the
# proportions.
unquantified:
  - to taste
  - as needed
  - as required
  - a pinch
  - pinch
  - q.b.
  - qb
  - quanto basta
  - a piacere
  - au goût
  - selon le goût
  - à volonté

