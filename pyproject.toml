[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterpriphy"
version = "1.0.0rc0"
description = "Enterprise-scale, multi-modal, bi-temporal knowledge graph platform (formerly graphify). Turn 20+ GB of mixed corpora — code, docs, office files, images, audio — into a queryable graph that reasons about fact validity over time."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["claude", "claude-code", "codex", "opencode", "cursor", "gemini", "aider", "kiro", "pi", "knowledge-graph", "rag", "graphrag", "obsidian", "community-detection", "tree-sitter", "leiden", "llm"]
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "datasketch",
    "rapidfuzz",
    "tree-sitter>=0.23.0",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-groovy",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-ruby",
    "tree-sitter-c-sharp",
    "tree-sitter-kotlin",
    "tree-sitter-scala",
    "tree-sitter-php",
    "tree-sitter-swift",
    "tree-sitter-lua",
    "tree-sitter-zig",
    "tree-sitter-powershell",
    "tree-sitter-elixir",
    "tree-sitter-objc",
    "tree-sitter-julia",
    "tree-sitter-verilog",
    "tree-sitter-fortran",
    "tree-sitter-bash",
    "tree-sitter-json",
]

[project.urls]
Homepage = "https://github.com/DanieleGVA/enterpriphy"
Repository = "https://github.com/DanieleGVA/enterpriphy"
Issues = "https://github.com/DanieleGVA/enterpriphy/issues"
"Upstream (graphify)" = "https://github.com/safishamsi/graphify"

[project.optional-dependencies]
mcp = ["mcp"]
neo4j = ["neo4j"]
pdf = ["pypdf", "markdownify"]
watch = ["watchdog"]
svg = ["matplotlib"]
leiden = ["graspologic; python_version < '3.13'"]
office = ["python-docx", "openpyxl"]
google = ["openpyxl"]
video = ["faster-whisper", "yt-dlp"]
kimi = ["openai", "tiktoken"]
ollama = ["openai"]
bedrock = ["boto3"]
gemini = ["openai", "tiktoken"]
openai = ["openai", "tiktoken"]
sql = ["tree-sitter-sql"]
all = ["mcp", "neo4j", "pypdf", "markdownify", "watchdog", "graspologic; python_version < '3.13'", "python-docx", "openpyxl", "faster-whisper", "yt-dlp", "matplotlib", "openai", "tiktoken", "boto3", "tree-sitter-sql"]

# Enterpriphy v1 — storage / orchestration / parsing stack (target architecture).
# Install with: pip install 'enterpriphy[storage]' or [orchestration] or [parsing]
storage = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "qdrant-client>=1.12",
    "boto3>=1.35",          # MinIO via S3 protocol
    "redis>=5.2",
]
orchestration = ["prefect>=3.1", "redis>=5.2", "rq>=2.0"]
parsing = ["pymupdf>=1.24", "docling>=2.0", "llama-cloud-services>=0.6"]
embeddings = ["sentence-transformers>=3.3", "FlagEmbedding>=1.3"]
enterpriphy = [
    "psycopg[binary]>=3.2", "sqlalchemy>=2.0", "alembic>=1.13",
    "qdrant-client>=1.12", "boto3>=1.35", "redis>=5.2",
    "prefect>=3.1", "rq>=2.0",
    "pymupdf>=1.24",
]

[project.scripts]
enterpriphy = "enterpriphy.__main__:main"
graphify = "enterpriphy.__main__:main"  # backward-compatible alias; deprecated in 2.0

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "build>=1.5.0",
    "hypothesis>=6.152.7",
    "nuitka>=4.1",
    "patchelf>=0.17.2.4 ; sys_platform != 'win32'",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "safety>=3.7.0",
    "setuptools>=82.0.1",
    "wheel>=0.47.0",
]

[tool.uv]
# Install via: uv tool install graphifyy
# Run without installing: uvx graphifyy install
package = true

[tool.setuptools]
packages = ["enterpriphy", "enterpriphy.storage", "graphify"]
include-package-data = false

[tool.setuptools.package-data]
enterpriphy = ["skill.md", "skill-codex.md", "skill-opencode.md", "skill-aider.md", "skill-copilot.md", "skill-claw.md", "skill-windows.md", "skill-droid.md", "skill-trae.md", "skill-kiro.md", "skill-vscode.md", "skill-pi.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "graphify-benchmark", "graphify_eval", "graphify_test",
    "worked", "llm-stack-corpus", "llm-stack-demo", "product-site",
    "scripts", "ebook", ".github", "dist", "build",
]

[tool.bandit]
skips = ["B404"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the committed baseline conservative until upstream adopts a broader lint policy.
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["enterpriphy", "graphify", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
