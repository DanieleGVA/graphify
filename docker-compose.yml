# Enterpriphy local development stack.
#
# Brings up the storage plane (Postgres, Redis, MinIO, Qdrant, Neo4j) and an
# embedding service (TEI serving BGE-M3). The application workers
# (`enterpriphy-worker`, `enterpriphy-api`, Prefect server) land in P3.
#
# Usage:
#   docker compose up -d
#   ENTERPRIPHY_DATABASE_URL=postgresql+psycopg://enterpriphy:enterpriphy@localhost:5432/enterpriphy \
#     alembic upgrade head
#
# Reset:
#   docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: enterpriphy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: enterpriphy
      POSTGRES_PASSWORD: enterpriphy
      POSTGRES_DB: enterpriphy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterpriphy -d enterpriphy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: enterpriphy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: enterpriphy-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: enterpriphy
      MINIO_ROOT_PASSWORD: enterpriphy-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: enterpriphy-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 enterpriphy enterpriphy-secret &&
      mc mb --ignore-existing local/enterpriphy-blobs &&
      mc mb --ignore-existing local/enterpriphy-renderings &&
      mc mb --ignore-existing local/enterpriphy-thumbnails &&
      mc mb --ignore-existing local/enterpriphy-tables-parquet &&
      echo 'buckets ready'
      "

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterpriphy-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: enterpriphy-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/enterpriphy-neo4j
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # bolt
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  tei:
    # Hugging Face Text Embeddings Inference — serves BGE-M3.
    # Pin a CPU image by default; switch to *-gpu in production.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: enterpriphy-tei
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - teidata:/data
    environment:
      HUGGINGFACE_HUB_CACHE: /data

volumes:
  pgdata:
  redisdata:
  miniodata:
  qdrantdata:
  neo4jdata:
  neo4jlogs:
  teidata:
